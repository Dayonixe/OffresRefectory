name: Extract offers from Refectory (daily)

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt

    - name: Install Chromium for extraction tests
      run: python -m playwright install --with-deps chromium

    - name: Run tests
      run: |
        pytest tests/

  run-export:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt

    - name: Install Playwright
      run: python -m playwright install --with-deps chromium

    - name: Run export script
      run: |
        python -m src.extract_offers

    - name: Upload extraction diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: extract-offers-diagnostics
        path: artifacts/extract-offers/
        if-no-files-found: ignore
        retention-days: 7
